<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Student registration · CloudQuiz</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body class="login-page"><div class="login-wrap"><div class="login-brand"><a class="brand" th:href="@{/login}"><span class="brand-mark">Q</span><span>Cloud<span class="brand-light">Quiz</span><small>ASSESSMENT SPACE</small></span></a><span class="cloud-pill"><i></i> STUDENT ACCESS</span></div><main class="login-card"><div class="eyebrow">NEW STUDENT ACCOUNT</div><h1>Create your login.</h1><p class="muted">Use your college ID so your teacher can identify your quiz results.</p><div class="alert error" th:if="${error}" th:text="${error}"></div><form th:action="@{/register}" method="post" class="stack"><label>Student ID<input type="text" name="username" placeholder="e.g. 1000025934" required minlength="3" maxlength="40"></label><label>Full name<input type="text" name="displayName" placeholder="Your name" required minlength="2" maxlength="80"></label><label>Password<input type="password" name="password" placeholder="At least 8 characters" required minlength="8" autocomplete="new-password"></label><button class="btn primary full" type="submit">Create student account <span>→</span></button></form><p class="muted" style="text-align:center;margin-top:20px">Already registered? <a style="color:#6658dc;font-weight:700" th:href="@{/login}">Sign in</a></p></main><div class="login-bottom">Teacher accounts are created separately for each subject.</div></div></body></html>

<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="_csrf" th:content="${_csrf.token}"><meta name="_csrf_header" th:content="${_csrf.headerName}"><title>Quiz in progress · CloudQuiz</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments :: nav}"></div><main class="page-shell exam-shell"><div class="exam-heading"><div><div class="eyebrow" th:text="${attempt.quiz.subject.label}">SUBJECT</div><h1 th:text="${attempt.quiz.title}">Quiz</h1><p class="muted">Choose one answer for each question. Your answers save automatically.</p></div><div class="timer-card"><span>TIME LEFT</span><strong id="timer">15:00</strong><small>Auto-submits at zero</small></div></div>
<div class="progress-wrap"><div><span id="answered-count">0</span> of 10 answered</div><div class="progress-track"><div id="progress-bar"></div></div><span class="save-indicator" id="save-state">All changes saved</span></div>
<form id="quiz-form" th:action="@{/student/attempt/{id}/submit(id=${attempt.id})}" method="post"><article class="question-card" th:each="q,stat:${attempt.quiz.questions}"><div class="question-label"><span>QUESTION <b th:text="${#numbers.formatInteger(stat.count,2)}">01</b></span><span class="mark-label">2 MARKS</span></div><h2 th:text="${q.prompt}">Question text</h2><div class="option-list"><label class="option-row" th:each="i:${#numbers.sequence(0,3)}"><input type="radio" th:name="|answer-${stat.index}|" th:value="${i}" th:checked="${attempt.selectedFor(q.id)==i}" th:attr="data-question=${stat.index}"><span class="option-letter" th:text="${'ABCD'.substring(i,i+1)}">A</span><span th:text="${q.option(i)}">Option</span></label></div></article><div class="exam-actions"><span class="muted">You can change an answer any time before the timer ends.</span><button class="btn primary" type="submit">Submit quiz <span>→</span></button></div></form>
</main><div th:replace="~{fragments :: foot}"></div><script th:inline="javascript">const endAt=/*[[${attempt.endsAt.toString()}]]*/'';const attemptId=/*[[${attempt.id}]]*/0;const csrf=/*[[${_csrf.token}]]*/'';const csrfHeader=/*[[${_csrf.headerName}]]*/'X-CSRF-TOKEN';const ends=new Date(endAt).getTime();const form=document.getElementById('quiz-form');let sending=false;let pendingSaves=Promise.resolve();
function sendAfterSaving(){pendingSaves.finally(()=>form.submit())}function updateTimer(){let left=Math.max(0,Math.floor((ends-Date.now())/1000));document.getElementById('timer').textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');if(left<=0&&!sending){sending=true;sendAfterSaving();}}setInterval(updateTimer,500);updateTimer();
function updateProgress(){const total=document.querySelectorAll('input[type=radio]:checked').length;document.getElementById('answered-count').textContent=total;document.getElementById('progress-bar').style.width=(total*10)+'%'}updateProgress();
document.querySelectorAll('input[type=radio]').forEach(input=>input.addEventListener('change',async()=>{updateProgress();const state=document.getElementById('save-state');state.textContent='Saving…';state.classList.add('saving');const body=new URLSearchParams({questionIndex:input.dataset.question,selectedOption:input.value});const request=pendingSaves.catch(()=>{}).then(()=>fetch(`/student/attempt/${attemptId}/answer`,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded',[csrfHeader]:csrf},body}));pendingSaves=request.catch(()=>{});try{const response=await request;state.textContent=response.ok?'Saved just now':'Save failed — check connection';if(!response.ok)state.classList.add('save-error');else state.classList.remove('save-error')}catch(e){state.textContent='Connection issue — check your connection';state.classList.add('save-error')}finally{state.classList.remove('saving')}}));
form.addEventListener('submit',e=>{e.preventDefault();if(!confirm('Submit this quiz now? You cannot change answers after submission.'))return;sending=true;sendAfterSaving();});</script></body></html>

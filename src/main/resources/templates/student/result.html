<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Quiz submitted · CloudQuiz</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments :: nav}"></div><main class="page-shell result-shell"><div class="result-card"><div class="result-icon">✓</div><div class="eyebrow">ASSESSMENT COMPLETE</div><h1>Your quiz has been submitted.</h1><p class="muted" th:text="${attempt.quiz.title}">Quiz name</p><div class="score-panel" th:if="${showScore}"><span>YOUR SCORE</span><strong th:text="|${attempt.score}|">16</strong><small>out of 20 marks</small><div class="result-track"><i th:style="|width:${attempt.score * 5}%|"></i></div><p th:text="|${attempt.answers.size()} answers saved · ${#temporals.format(attempt.submittedAt,'dd MMM yyyy, hh:mm a')}|">Saved</p></div><div class="hidden-score" th:unless="${showScore}"><span class="lock-icon">◈</span><strong>Score is not released yet</strong><p>Your teacher has chosen to hide marks for this assessment. Check back after they release them.</p></div><a class="btn primary" th:href="@{/student}">Back to dashboard <span>→</span></a></div></main><div th:replace="~{fragments :: foot}"></div></body></html>

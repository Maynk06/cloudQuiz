<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Change password · CloudQuiz</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments :: nav}"></div><main class="page-shell editor-shell"><a class="back-link" th:href="@{/teacher}">← Back to workspace</a><div class="editor-title"><div><div class="eyebrow">TEACHER ACCOUNT</div><h1>Change your password</h1><p class="muted">Update the password for <strong th:text="${teacher.username}">teacher</strong>.</p></div></div><div class="alert error" th:if="${error}" th:text="${error}"></div><div class="alert success" th:if="${success}" th:text="${success}"></div><form th:action="@{/teacher/password}" method="post" class="form-section password-form"><label>Current password<input type="password" name="currentPassword" autocomplete="current-password" required></label><label>New password<input type="password" name="newPassword" minlength="8" autocomplete="new-password" required><small>Use at least 8 characters.</small></label><label>Confirm new password<input type="password" name="confirmPassword" minlength="8" autocomplete="new-password" required></label><button class="btn primary" type="submit">Save new password <span>→</span></button></form></main><div th:replace="~{fragments :: foot}"></div></body></html>
